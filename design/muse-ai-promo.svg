<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">Muse AI 成品账号 · 文文的AI充电站</title>
  <desc id="description">浅色商品宣传图。蓝色笔画在叠放的卡片上逐渐成形，展示 Muse AI 成品账号。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EDF7F7"/>
      <stop offset="1" stop-color="#EDF2FB"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF"/>
      <stop offset=".58" stop-color="#F6F8FF"/>
      <stop offset="1" stop-color="#E9EEFC"/>
    </linearGradient>
    <linearGradient id="ink" x1="650" y1="365" x2="995" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D60CE"/>
      <stop offset=".57" stop-color="#3475E0"/>
      <stop offset="1" stop-color="#678FEF"/>
    </linearGradient>
    <filter id="shadow" x="-27%" y="-35%" width="154%" height="185%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <path id="brush" d="M652 470 C677 440 703 401 729 385 S744 413 731 457 C721 491 722 518 741 510 C764 501 796 433 828 407 C851 389 861 407 853 435 C842 476 838 502 854 505 C879 508 913 465 942 444 C958 432 975 431 988 437"/>
    <mask id="reveal" x="600" y="335" width="450" height="240" maskUnits="userSpaceOnUse">
      <use href="#brush" xlink:href="#brush" id="trace" fill="none" stroke="white" stroke-width="50" stroke-linecap="round"/>
    </mask>
  </defs>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    #trace { stroke-dasharray: 850; stroke-dashoffset: 0; animation: draw 6s infinite; }
    #light { animation: settle 6s infinite; }
    #accent { animation: shimmer 6s infinite; }
    @keyframes draw {
      0%, 6% { stroke-dashoffset: 850; }
      43%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes settle {
      0%, 7%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes shimmer {
      0%, 6% { opacity: .28; }
      46% { opacity: 1; }
      72% { opacity: .8; }
      100% { opacity: .28; }
    }
    @media (prefers-reduced-motion: reduce) { #trace, #light, #accent { animation: none; } }
  </style>

  <path d="M0 0h1200v900H0z" fill="#F7F7F7"/>
  <path d="M60 139h1080" stroke="#DFE0E2"/>
  <text x="61" y="105" fill="#202124" font-size="30" font-weight="700" letter-spacing="-.8">文文的AI充电站</text>
  <text x="1139" y="104" text-anchor="end" fill="#615F65" font-size="21" font-weight="500">gptpay1688.com</text>

  <rect x="60" y="185" width="1080" height="582" rx="34" fill="#242E40" opacity=".05" filter="url(#shadow)"/>
  <rect x="60" y="177" width="1080" height="582" rx="34" fill="#FFF" stroke="#E0E1E4"/>
  <rect x="550" y="210" width="556" height="516" rx="26" fill="url(#panel)" stroke="#DFE7F0"/>

  <g transform="translate(111 273)">
    <rect width="107" height="42" rx="21" fill="#EEF3FD"/>
    <text x="53.5" y="28" text-anchor="middle" fill="#315FAC" font-size="18" font-weight="600">AI 工具</text>
    <text x="-4" y="151" fill="#202124" font-size="91" font-weight="700" letter-spacing="-4">Muse AI</text>
    <text x="0" y="227" fill="#202124" font-size="61" font-weight="700" letter-spacing="-1.5">成品账号</text>
    <text x="2" y="286" fill="#575D66" font-size="26">独立账号</text>
    <rect x="0" y="334" width="198" height="56" rx="28" fill="#EEF3FD"/>
    <text x="99" y="370" text-anchor="middle" fill="#315FAC" font-size="21" font-weight="600">10 亿 / 310 亿</text>
  </g>

  <g aria-hidden="true">
    <rect x="633" y="342" width="398" height="272" rx="30" fill="#6681AE" opacity=".24" filter="url(#shadow)"/>
    <rect x="658" y="317" width="389" height="258" rx="27" fill="#D8E6F6" stroke="#FFF" stroke-opacity=".9" transform="rotate(10 852 446)"/>
    <rect x="637" y="327" width="389" height="258" rx="27" fill="#E0EDEB" stroke="#FFF" stroke-opacity=".95" transform="rotate(2 831 456)"/>
    <g transform="rotate(-7 819 470)">
      <rect x="617" y="336" width="404" height="270" rx="28" fill="#4D679A" opacity=".16" filter="url(#shadow)"/>
      <rect x="617" y="334" width="404" height="270" rx="28" fill="url(#card)" stroke="#FFF" stroke-width="2"/>
      <rect x="619" y="336" width="400" height="266" rx="26" fill="none" stroke="#DAE3F4"/>
      <use href="#brush" xlink:href="#brush" fill="none" stroke="#DEE7F8" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="light" mask="url(#reveal)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <use href="#brush" xlink:href="#brush" stroke="url(#ink)" stroke-width="27"/>
        <use href="#brush" xlink:href="#brush" stroke="#C7DCFF" stroke-opacity=".56" stroke-width="1.4" transform="translate(0 -6)"/>
      </g>
      <path d="M647 544h344" stroke="#DCE4F5"/>
      <text x="648" y="575" fill="#4D6493" font-size="14" font-weight="600" letter-spacing="2.4">MUSE AI</text>
      <text x="990" y="575" fill="#4D6493" font-size="14" font-weight="600" text-anchor="end">成品账号</text>
    </g>
    <path id="accent" d="M1012 270q2 17 19 19-17 2-19 19-2-17-19-19 17-2 19-19Z" fill="#6E9BE8"/>
  </g>

  <text x="62" y="824" fill="#636871" font-size="20">规格与库存以商品页为准</text>
  <text x="1138" y="824" text-anchor="end" fill="#636871" font-size="20">AI 订阅与数字工具服务</text>
</svg>
